services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-appdb}
      POSTGRES_USER: ${DB_USER:-appuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant, copiez .env.example en .env}
    volumes:
      # Volume nommé : les données survivent à l'arrêt et à la suppression des conteneurs
      - db_data:/var/lib/postgresql/data
      # Script exécuté au premier démarrage pour créer la table users
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-appuser} -d ${DB_NAME:-appdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [reseau_app]
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-appdb}
      DB_USER: ${DB_USER:-appuser}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant, copiez .env.example en .env}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY manquant, copiez .env.example en .env}
    depends_on:
      db:
        condition: service_healthy
    networks: [reseau_app]
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    networks: [reseau_app]
    restart: unless-stopped

volumes:
  db_data:

networks:
  reseau_app:
    driver: bridge
